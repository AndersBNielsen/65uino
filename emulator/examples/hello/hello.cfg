# 65uino memory map: RIOT RAM $00-$7F (zero page + stack), ROM $1000-$1FFF
MEMORY {
    ZP:  start = $0000, size = $0070, type = rw, file = "";
    ROM: start = $1000, size = $1000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = ROM, type = ro, align = $100;
    VECTORS:  load = ROM, type = ro, start = $1FFA;
}
